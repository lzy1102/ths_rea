name: Release

# 触发方式二选一:
#   1) 在 GitHub 上点 Release -> Publish (触发 release: published)
#   2) 本地打标签推送: git tag v0.13.0 && git push origin v0.13.0
on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # 需要上传产物到 Release

jobs:
  build:
    name: 构建发布产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装构建工具
        run: python -m pip install --upgrade pip build twine

      - name: 跑一遍离线测试 (发布前守门)
        run: |
          python -m pip install -e .
          python tests/test_offline.py

      - name: 标签与版本一致性 (标签推送时)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(python -c "import re,pathlib;print(re.search(r'^version\s*=\s*\"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(encoding='utf-8'), re.M).group(1))")
          echo "tag=$TAG  pyproject=$VER"
          [ "$TAG" = "$VER" ] || { echo "标签 v$TAG 与版本 $VER 不一致"; exit 1; }

      - name: 构建 wheel + sdist
        run: python -m build

      - name: 元数据自检 (twine)
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  attach:
    name: 附加产物到 Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: 上传 whl/sdist 到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          gh release upload "$TAG" dist/* --clobber
          echo "已附加: $(ls dist/)"

  pypi:
    name: 发布到 PyPI (可选)
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.PYPI_API_TOKEN != '' }}
    environment: pypi
    permissions:
      id-token: write          # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true