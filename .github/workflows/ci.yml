name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Windows runner 控制台默认 cp1252 -> 强制 UTF-8 (否则中文测试名会 UnicodeEncodeError)
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  test:
    name: test ${{ matrix.os }} / py${{ matrix.py }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 显式列举: 3.9=依赖地板, 3.15=当前最新(2026-10-09 发布), windows 是主用平台
        include:
          - os: ubuntu-latest
            py: '3.9'
          - os: ubuntu-latest
            py: '3.13'
          - os: ubuntu-latest
            py: '3.14'
          - os: ubuntu-latest
            py: '3.15'
          - os: windows-latest
            py: '3.12'
          - os: windows-latest
            py: '3.15'
          - os: macos-latest
            py: '3.12'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[capture]

      - name: 离线回归测试 (15 项)
        run: python tests/test_offline.py

      - name: 导入自检
        run: python -c "import ths_client, ths_client.parse, ths_client.capture_orders, ths_client.capture_profile; print('import ok', ths_client.__version__)"

      - name: 依赖地板测试 (pycryptodome 3.x 下限)
        if: matrix.py == '3.9'
        run: |
          python -m pip install "pycryptodome>=3.23,<4"
          python -c "import Crypto; print('pycryptodome', Crypto.__version__)"
          python tests/test_offline.py

  audit:
    name: 敏感信息审计（源码+历史）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 必须完整历史, 否则 --history 只看得到1个提交

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 审计源码与 git 历史
        run: python tools/prepublish_audit.py --history

  build:
    name: 构建 wheel/sdist
    runs-on: ubuntu-latest
    needs: [test, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装构建工具
        run: python -m pip install --upgrade pip build

      - name: 版本一致性检查 (pyproject == __init__)
        run: |
          python - <<'PY'
          import re, pathlib, sys
          py = pathlib.Path('pyproject.toml').read_text(encoding='utf-8')
          ini = pathlib.Path('ths_client/__init__.py').read_text(encoding='utf-8')
          v1 = re.search(r'^version\s*=\s*"([^"]+)"', py, re.M).group(1)
          v2 = re.search(r'__version__\s*=\s*"([^"]+)"', ini).group(1)
          print('pyproject=%s  __init__=%s' % (v1, v2))
          sys.exit(0 if v1 == v2 else 1)
          PY

      - name: 构建
        run: python -m build

      - name: 校验 wheel 内容 (数据模板/入口点)
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          whl = sorted(glob.glob('dist/*.whl'))[-1]
          z = zipfile.ZipFile(whl)
          names = z.namelist()
          need = ['ths_client/data/hello.bin',
                  'ths_client/data/startup/01_0030_1208.bin',
                  'ths_client/data/startup_sh/01_0029_456.bin',
                  'ths_client/capture_profile.py',
                  'ths_client/capture_orders.py']
          miss = [n for n in need if n not in names]
          ep = [n for n in names if n.endswith('entry_points.txt')]
          if ep:
              txt = z.read(ep[0]).decode()
              for cmd in ('ths-capture-profile', 'ths-capture-orders'):
                  if cmd not in txt:
                      miss.append('entry:' + cmd)
          print('wheel:', whl, '条目:', len(names))
          if miss:
              print('缺失:', miss); sys.exit(1)
          print('wheel 内容校验通过')
          PY

      - name: 安装 wheel 冒烟 (import + 入口点)
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl || /tmp/venv/Scripts/pip install dist/*.whl
          /tmp/venv/bin/python -c "import ths_client; print('installed', ths_client.__version__)" \
            || /tmp/venv/Scripts/python -c "import ths_client; print('installed', ths_client.__version__)"
          /tmp/venv/bin/python -m ths_client.capture_orders --help >/dev/null \
            || /tmp/venv/Scripts/python -m ths_client.capture_orders --help >/dev/null

      - name: 审计构建产物（wheel METADATA 会内嵌 README）
        run: python tools/audit_artifacts.py dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error